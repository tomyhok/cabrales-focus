<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Escena 1 — El Producto y la Experiencia | Cabrales Focus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: #040508;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
  }

  /* Fondo de estudio cinematográfico con iluminación lateral */
  .studio-bg {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 50% 48%, rgba(4, 189, 251, 0.22) 0%, rgba(6, 12, 28, 0.7) 45%, #040508 85%),
      radial-gradient(circle at 85% 35%, rgba(0, 102, 255, 0.18) 0%, transparent 55%),
      radial-gradient(circle at 15% 65%, rgba(138, 79, 255, 0.14) 0%, transparent 50%),
      radial-gradient(circle at 50% 0%, rgba(4, 189, 251, 0.10) 0%, transparent 60%);
  }

  /* Microtextura de estudio y neblina volumétrica */
  .studio-atmosphere {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse at 50% 50%, rgba(4, 189, 251, 0.08) 0%, transparent 70%),
      linear-gradient(to bottom, rgba(4, 5, 8, 0.3) 0%, transparent 40%, rgba(4, 5, 8, 0.8) 100%);
    pointer-events: none;
  }

  /* Piso de estudio oscuro con reflejo especular de alto brillo */
  .studio-floor {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 720px;
    background: linear-gradient(to bottom, rgba(7, 10, 18, 0.35) 0%, #030406 100%);
    border-top: 1px solid rgba(4, 189, 251, 0.25);
    perspective: 1200px;
  }

  .floor-reflection-glow {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 320px;
    background: radial-gradient(ellipse at top, rgba(4, 189, 251, 0.35) 0%, rgba(0, 85, 255, 0.18) 40%, transparent 75%);
    filter: blur(45px);
  }

  /* Hero Can Container - Ángulo contrapicado / presencia publicitaria */
  .hero-can-wrapper {
    position: absolute;
    top: 360px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 1050px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .can-backlight {
    position: absolute;
    width: 580px;
    height: 850px;
    background: radial-gradient(ellipse at center, rgba(4, 189, 251, 0.38) 0%, rgba(0, 102, 255, 0.15) 50%, transparent 72%);
    filter: blur(65px);
    z-index: 1;
  }

  .can-image {
    position: relative;
    height: 980px;
    width: auto;
    object-fit: contain;
    z-index: 5;
    filter: 
      drop-shadow(0 30px 70px rgba(0, 0, 0, 0.95))
      drop-shadow(0 0 45px rgba(4, 189, 251, 0.35));
  }

  .can-mirror {
    position: absolute;
    top: 970px;
    height: 480px;
    transform: scaleY(-1);
    opacity: 0.28;
    filter: blur(5px);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 75%);
    z-index: 4;
    pointer-events: none;
  }

  /* Luces laterales de estudio (Rim light cyan / white) */
  .studio-flare-left {
    position: absolute;
    top: 420px;
    left: 80px;
    width: 280px;
    height: 600px;
    background: radial-gradient(ellipse at center, rgba(4, 189, 251, 0.28) 0%, transparent 70%);
    filter: blur(60px);
    z-index: 2;
  }

  .studio-flare-right {
    position: absolute;
    top: 400px;
    right: 80px;
    width: 260px;
    height: 550px;
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.18) 0%, rgba(4, 189, 251, 0.12) 40%, transparent 70%);
    filter: blur(55px);
    z-index: 2;
  }

  /* Sutil indicador visual de localización de QR en la lata */
  .qr-indicator-beacon {
    position: absolute;
    top: 520px;
    left: 620px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 2px solid rgba(4, 189, 251, 0.85);
    box-shadow: 0 0 30px rgba(4, 189, 251, 0.6), inset 0 0 15px rgba(4, 189, 251, 0.4);
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qr-beacon-core {
    width: 14px;
    height: 14px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 15px #04BDFB, 0 0 25px #ffffff;
  }

  .qr-beacon-label {
    position: absolute;
    left: 105px;
    background: rgba(9, 13, 22, 0.88);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(4, 189, 251, 0.5);
    padding: 8px 18px;
    border-radius: 99px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #04BDFB;
    white-space: nowrap;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <!-- Fondo de estudio -->
  <div class="studio-bg"></div>
  <div class="studio-atmosphere"></div>
  <div class="studio-floor">
    <div class="floor-reflection-glow"></div>
  </div>

  <div class="studio-flare-left"></div>
  <div class="studio-flare-right"></div>

  <!-- Hero Can y Luces de Estudio (Contrapicado cinematográfico) -->
  <div class="hero-can-wrapper">
    <div class="can-backlight"></div>
    <img src="../can_hero.png" alt="Lata Cabrales Focus" class="can-image">
    <img src="../can_hero.png" alt="Reflejo" class="can-mirror">

    <!-- Indicador de localización de QR bajo la anilla -->
    <div class="qr-indicator-beacon">
      <div class="qr-beacon-core"></div>
      <div class="qr-beacon-label">QR Único · Escaneá tu lata</div>
    </div>
  </div>

</body>
</html>
