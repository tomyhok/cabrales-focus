<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: #000;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.75) 0%,
      rgba(0, 0, 0, 0.2) 20%,
      rgba(0, 0, 0, 0.1) 50%,
      rgba(0, 0, 0, 0.5) 80%,
      rgba(0, 0, 0, 0.88) 100%
    );
  }

  .story-top {
    position: absolute;
    top: 50px;
    left: 40px;
    right: 40px;
    z-index: 10;
  }

  .progress-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .progress-seg {
    flex: 1;
    height: 5px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-seg.active {
    background: #ffffff;
  }

  .user-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .avatar-ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    padding: 3px;
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #090303;
    border: 2px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #04bdfb;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.05em;
  }
  .username-col {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .username {
    color: #ffffff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .timestamp {
    color: rgba(255, 255, 255, 0.7);
    font-size: 24px;
  }
  .close-icon {
    color: #ffffff;
    font-size: 34px;
    font-weight: 300;
  }

  .story-center {
    position: absolute;
    top: 440px;
    left: 70px;
    right: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
    z-index: 10;
  }

  .question-pill {
    background: rgba(9, 3, 3, 0.65);
    backdrop-filter: blur(25px);
    border: 1.5px solid rgba(4, 189, 251, 0.35);
    border-radius: 32px;
    padding: 34px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(4, 189, 251, 0.15);
    max-width: 880px;
  }
  .question-text {
    color: #ffffff;
    font-size: 40px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.02em;
  }

  .poll-sticker {
    width: 680px;
    background: #ffffff;
    border-radius: 36px;
    padding: 32px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .poll-label {
    font-size: 24px;
    font-weight: 700;
    color: #666;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .poll-options {
    width: 100%;
    display: flex;
    gap: 16px;
  }
  .poll-opt {
    flex: 1;
    background: #f0f2f5;
    padding: 24px 16px;
    border-radius: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: #111111;
    border: 2px solid transparent;
  }

  .story-bottom {
    position: absolute;
    bottom: 60px;
    left: 40px;
    right: 40px;
    display: flex;
    align-items: center;
    gap: 24px;
    z-index: 10;
  }
  .reply-bar {
    flex: 1;
    height: 76px;
    border-radius: 999px;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    padding: 0 32px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 24px;
    font-weight: 500;
  }
  .icon-btn {
    font-size: 40px;
    color: #ffffff;
  }
</style>
</head>
<body>
  <img src="story_2_bg_escritorio.jpg" class="bg-image" alt="Fondo Escritorio y Celular">
  <div class="overlay-gradient"></div>

  <div class="story-top">
    <div class="progress-bar">
      <div class="progress-seg active"></div>
      <div class="progress-seg active"></div>
      <div class="progress-seg"></div>
      <div class="progress-seg"></div>
    </div>
    <div class="user-header">
      <div class="user-info">
        <div class="avatar-ring">
          <img src="pfp_focus_ig.png" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid #000;" alt="cabrales.focus">
        </div>
        <div class="username-col">
          <span class="username">cabrales.focus</span>
          <span class="timestamp">• 2 h</span>
        </div>
      </div>
      <div class="close-icon">✕</div>
    </div>
  </div>

  <div class="story-center">
    <div class="question-pill">
      <div class="question-text">Tenés diez minutos.<br>¿Qué elegís primero?</div>
    </div>

    <div class="poll-sticker">
      <div class="poll-label">Tu próxima decisión:</div>
      <div class="poll-options">
        <div class="poll-opt">Ordenar una tarea</div>
        <div class="poll-opt">Hacer una pausa</div>
      </div>
    </div>
  </div>

  <div class="story-bottom">
    <div class="reply-bar">Enviar mensaje...</div>
    <div class="icon-btn">🤍</div>
    <div class="icon-btn">✈️</div>
  </div>
</body>
</html>
