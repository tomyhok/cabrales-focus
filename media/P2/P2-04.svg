<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><radialGradient id="g"><stop stop-color="#154454"/><stop offset="1" stop-color="#101618"/></radialGradient></defs><rect width="1080" height="1350" fill="#101618"/><circle cx="950" cy="650" r="650" fill="url(#g)"/><g font-family="Arial, Helvetica, sans-serif"><text x="72" y="88.0" fill="#f5f3ee" font-size="26" font-weight="700">CABRALES</text><text x="235" y="88.0" fill="#49d3ff" font-size="26" font-weight="700">FOCUS</text><text x="900" y="88.0" fill="#f5f3ee" font-size="23" font-weight="400">04 / 06</text><path d="M72 122H1008" stroke="#3a4a50"/><text x="72" y="187.0" fill="#49d3ff" font-size="22" font-weight="700">03 / QUÉ CONTIENE</text><text x="72" y="310.0" fill="#f5f3ee" font-size="90" font-weight="700">Café + azúcar</text><text x="72" y="427.0" fill="#f5f3ee" font-size="90" font-weight="700">+ L-teanina.</text><rect x="72" y="530" width="290" height="190" rx="20" fill="#1d3039"/><text x="94" y="615.0" fill="#49d3ff" font-size="49" font-weight="700">240</text><text x="94" y="668.0" fill="#f5f3ee" font-size="23" font-weight="400">ml por lata</text><rect x="395" y="530" width="290" height="190" rx="20" fill="#1d3039"/><text x="417" y="615.0" fill="#49d3ff" font-size="49" font-weight="700">6 g</text><text x="417" y="668.0" fill="#f5f3ee" font-size="23" font-weight="400">azúcar añadida</text><rect x="718" y="530" width="290" height="190" rx="20" fill="#1d3039"/><text x="740" y="615.0" fill="#49d3ff" font-size="49" font-weight="700">100 mg</text><text x="740" y="668.0" fill="#f5f3ee" font-size="23" font-weight="400">L-teanina</text><text x="72" y="820.0" fill="#f5f3ee" font-size="36" font-weight="400">Sin leche ni crema añadidas.</text><text x="72" y="866.8" fill="#f5f3ee" font-size="36" font-weight="400">Sin cafeína añadida:</text><text x="72" y="913.6" fill="#f5f3ee" font-size="36" font-weight="400">la cafeína proviene del ca